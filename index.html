function stopFireworks(){cancelAnimationFrame(frame);document.body.classList.remove("show-fireworks");const c=$("fx");const ctx=c.getContext("2d");ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height)}

function fireworks(done=()=>{}){
 stopFireworks();
 const c=$("fx"),ctx=c.getContext("2d");
 if(matchMedia("(prefers-reduced-motion: reduce)").matches){done();return}
 document.body.classList.add("show-fireworks");
 const dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
 const palettes=[["#478aff","#85c5ff"],["#ffd34b","#fff0a5"],["#44df85","#b3ffc1"],["#f65a9c","#ffc0dc"],["#a879ed","#dfbaff"],["#ff833c","#ffc17b"],["#e9b55a","#fff4cd"]];
 const rockets=[],particles=[],flashes=[];
 const scale=Math.min(w,h), rand=(a,b)=>a+Math.random()*(b-a);
 const schedule=[0,950,2050,3250,4500,5700,6800,7850,8700,9550,10350,11000,11600,12200,12800,13200];
 let start=performance.now(),last=start,next=0;
 function launch(i,now){
  const finale=i>=11, x=w*(finale?rand(.19,.81):rand(.28,.72)), y=h*rand(.22,.47);
  rockets.push({x,y,fromX:w*rand(.38,.62),born:now,duration:rand(650,1050),palette:palettes[i%palettes.length],style:i%4,trail:[]});
 }
 function burst(r,now){
  const count= Math.min(230,Math.max(130,Math.round(scale*.29))), radius=scale*rand(.23,.38);
  flashes.push({x:r.x,y:r.y,born:now,radius:radius*.17});
  for(let j=0;j<count;j++){
   // Radial shells with random variation, not drawn silhouettes.
   const angle=j/count*Math.PI*2+rand(-.09,.09);
   const speed=radius*rand(1.05,1.7)*(r.style===1?rand(.48,1):1);
   const color=r.style===3?"#edbd73":r.palette[Math.random()<.23?1:0];
   particles.push({x:r.x,y:r.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,age:0,life:rand(1.65,3.0)+(r.style===3?.8:0),drag:r.style===3?.77:1.08,gravity:scale*(r.style===3?.13:.105),color,tail:[],size:rand(.65,1.55),twinkle:Math.random()<.32,phase:rand(0,6.28),style:r.style});
  }
  // A small bright inner core adds depth to each burst.
  for(let j=0;j<32;j++){
   const a=rand(0,Math.PI*2),v=radius*rand(.15,.65);
   particles.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,age:0,life:rand(.55,1.3),drag:1.5,gravity:scale*.12,color:"#fff0b8",tail:[],size:rand(.65,1.2),twinkle:false,phase:0,style:0});
  }
 }
 function streak(points,color,alpha,width){
  if(points.length<2)return;
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";
  for(let j=1;j<points.length;j++){
   ctx.globalAlpha=alpha*(j/points.length)**1.7;
   ctx.beginPath();ctx.moveTo(points[j-1][0],points[j-1][1]);ctx.lineTo(points[j][0],points[j][1]);ctx.stroke();
  }
 }
 function draw(now){
  const elapsed=now-start,dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation="lighter";
  while(next<schedule.length&&elapsed>=schedule[next])launch(next++,now);
  for(let i=rockets.length-1;i>=0;i--){
   const r=rockets[i],t=Math.min(1,(now-r.born)/r.duration),e=1-(1-t)**1.55;
   const x=r.fromX+(r.x-r.fromX)*t,y=h-(h-r.y)*e;
   r.trail.push([x,y]);if(r.trail.length>20)r.trail.shift();
   streak(r.trail,"#f6b95f",.9,1.8);
   ctx.globalAlpha=1;ctx.fillStyle="#fff4ce";ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
   if(t>=1){burst(r,now);rockets.splice(i,1)}
  }
  for(let i=flashes.length-1;i>=0;i--){
   const f=flashes[i],t=(now-f.born)/180;if(t>=1){flashes.splice(i,1);continue}
   const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,Math.max(1,f.radius*(.5+t)));
   g.addColorStop(0,"rgba(255,242,200,.8)");g.addColorStop(1,"rgba(255,180,80,0)");
   ctx.globalAlpha=(1-t)**2;ctx.fillStyle=g;ctx.fillRect(f.x-f.radius*2,f.y-f.radius*2,f.radius*4,f.radius*4);
  }
  for(let i=particles.length-1;i>=0;i--){
   const p=particles[i];p.age+=dt;const t=p.age/p.life;if(t>=1){particles.splice(i,1);continue}
   const drag=Math.exp(-p.drag*dt);p.vx*=drag;p.vy=p.vy*drag+p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
   p.tail.push([p.x,p.y]);const maxTail=p.style===3?21:10;if(p.tail.length>maxTail)p.tail.shift();
   const fade=Math.min(1,(1-t)*2.25), shimmer=p.twinkle?(.35+.65*Math.pow(Math.sin(p.phase+p.age*23),2)):1;
   const color=t>.72?"#e5aa60":p.color;
   streak(p.tail,color,fade*.72,p.size*.8);
   ctx.globalAlpha=fade*shimmer;ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
   if(t<.37){ctx.globalAlpha=fade*.75;ctx.fillStyle="#fff8df";ctx.beginPath();ctx.arc(p.x,p.y,p.size*.47,0,Math.PI*2);ctx.fill()}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
  if(next<schedule.length||particles.length||rockets.length||flashes.length)frame=requestAnimationFrame(draw);else{stopFireworks();done()}
 }
 frame=requestAnimationFrame(draw);
}
window.addEventListener("pageshow",e=>{if(e.persisted)move(0)});
render();
